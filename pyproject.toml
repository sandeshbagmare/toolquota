[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "toolquota"
version = "0.1.0"
description = "Client-side per-tool rate limits for agents, with a wait time the loop can use"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Sandesh Bagmare" }]
keywords = ["agents", "llm", "rate-limiting", "tool-calls", "quota"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/sandeshbagmare/toolquota"
Issues = "https://github.com/sandeshbagmare/toolquota/issues"
Changelog = "https://github.com/sandeshbagmare/toolquota/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/toolquota"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = "-q --doctest-modules"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
